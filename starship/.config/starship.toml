# Place this file at: ~/.config/starship.toml

# ── Prompt Layout ────────────────────────────────────────────────────────────
# Line 1: context (user/host if SSH), directory, git info, language versions
# Line 2: character (❯)

# run this in the shell if want to time the starship time.
# STARSHIP_LOG=trace starship timings

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$rust\
$golang\
$java\
$php\
$ruby\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ── User / Host (shown only in SSH sessions) ──────────────────────────────────
[username]
show_always = false          # flip to true if you always want user@host
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold yellow"
format = "[$hostname]($style) "

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
truncation_length = 4        # how many path segments to show
truncate_to_repo = true      # shorten to git root when inside a repo
style = "bold cyan"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = " "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ── Language / Runtime Versions ───────────────────────────────────────────────
[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".nvmrc", ".node-version"]

[python]
symbol = " "
style = "bold yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
detect_files = ["requirements.txt", "pyproject.toml", ".python-version", "Pipfile"]

[rust]
symbol = " "
style = "bold orange"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold red"
format = "[$symbol($version )]($style)"

[php]
symbol = " "
style = "bold blue"
format = "[$symbol($version )]($style)"

[ruby]
symbol = " "
style = "bold red"
format = "[$symbol($version )]($style)"

# ── Docker ────────────────────────────────────────────────────────────────────
[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true        # only shows when a Dockerfile/compose file is present

# ── Command Duration ──────────────────────────────────────────────────────────
[cmd_duration]
min_time = 2_000              # show duration only when command took > 2 seconds
style = "bold yellow"
format = "took [$duration]($style) "

# ── Prompt Character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"   # switches symbol in vi-mode
